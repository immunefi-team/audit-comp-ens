name: Build ENS V2 Snapshot

on:
  workflow_dispatch:
    inputs:
      fork_block:
        description: 'Sepolia block to pin (empty = latest)'
        required: false
        type: string
  schedule:
    - cron: '0 2 * * 1'  # Weekly Mon 02:00 UTC

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Seed Anvil state
        run: bash e2e/infra/scripts/seed-state.sh
        env:
          SEPOLIA_FORK_URL: ${{ secrets.SEPOLIA_FORK_URL }}
          SEPOLIA_FORK_BLOCK: ${{ inputs.fork_block }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/ensdomains/ens-v2-snapshot
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYY-MM-DD'}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: e2e/infra
          file: e2e/infra/Dockerfile.anvil-snapshot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
