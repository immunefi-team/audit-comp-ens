name: Crowdin

on:
  push:
    branches: [main]
    paths:
      - 'apps/manager/src/locales/en/messages.po'
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'push-and-pull'
        type: choice
        options:
          - push
          - pull
          - push-and-pull

jobs:
  push:
    name: Push sources to Crowdin
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'pull')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Upload sources
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: false
          download_translations: false
          config: apps/manager/crowdin.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: 877908
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  pull:
    name: Pull translations from Crowdin
    runs-on: ubuntu-latest
    needs: [push]
    if: >-
      !failure() && !cancelled() && (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && github.event.inputs.action != 'push')
      )
    steps:
      - uses: actions/checkout@v7

      - name: Download translations
        uses: crowdin/github-action@v2
        with:
          upload_sources: false
          upload_translations: false
          download_translations: true
          create_pull_request: true
          pull_request_title: 'chore: update translations from Crowdin'
          pull_request_base_branch_name: main
          config: apps/manager/crowdin.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROWDIN_PROJECT_ID: 877908
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
